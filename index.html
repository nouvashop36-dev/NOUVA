            {
                id: 18,
                nameAr: 'طقم أساور فاخر',
                nameEn: 'Luxury Bracelet Set',
                descAr: 'طقم أساور ذهبية وفضية بتصميم عصري',
                descEn: 'Gold and silver bracelet set with modern design',
                price: 1650,
                originalPrice: 2300,
                image: 'https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?w=500&h=500&fit=crop'
            },
            {
                id: 19,
                nameAr: 'بدلة رسمية فاخرة',
                nameEn: 'Luxury Formal Suit',
                descAr: 'بدلة رسمية بتصميم إيطالي راقي',
                descEn: 'Formal suit with elegant Italian design',
                price: 4500,
                originalPrice: 6000,
                image: 'https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=500&h=500&fit=crop'
            },
            {
                id: 20,
                nameAr: 'حقيبة ظهر فاخرة',
                nameEn: 'Luxury Backpack',
                descAr: 'حقيبة ظهر جلدية بتصميم عملي وأنيق',
                descEn: 'Leather backpack with practical and elegant design',
                price: 1400,
                originalPrice: 2000,
                image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500&h=500&fit=crop'
            }
        ];
        
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="showProductDetails(${product.id})">
                    <div style="overflow: hidden;">
                        <img src="${product.image}" alt="${currentLang === 'ar' ? product.nameAr : product.nameEn}" class="product-image">
                    </div>
                    <div style="padding: 25px;">
                        <h3 class="gold-text" style="font-size: 20px; font-weight: 700; margin-bottom: 10px;">${currentLang === 'ar' ? product.nameAr : product.nameEn}</h3>
                        <p style="color: #aaa; font-size: 14px; margin-bottom: 15px; line-height: 1.6;">${currentLang === 'ar' ? product.descAr : product.descEn}</p>
                        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                            <span class="price-original">${formatPrice(product.originalPrice)}</span>
                            <span class="price-discount">${formatPrice(product.price)}</span>
                        </div>
                        ${getProductCartControls(product.id)}
                    </div>
                </div>
            `).join('');
        }
        
        function getProductCartControls(productId) {
            const cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                return `
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="event.stopPropagation(); updateQuantity(${productId}, -1)">-</button>
                        <span style="color: #fff; font-weight: 700; min-width: 30px; text-align: center;">${cartItem.quantity}</span>
                        <button class="quantity-btn" onclick="event.stopPropagation(); updateQuantity(${productId}, 1)">+</button>
                    </div>
                `;
            } else {
                return `<button class="luxury-btn" style="width: 100%;" onclick="event.stopPropagation(); addToCart(${productId})">${translations[currentLang].addToCart}</button>`;
            }
        }
        
        function formatPrice(price) {
            if (currentCurrency === 'EUR') {
                return `€${(price / 10).toFixed(2)}`;
            }
            return `${price} درهم`;
        }
        
        function showProductDetails(id) {
            const product = products.find(p => p.id === id);
            const modal = document.getElementById('productModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.innerHTML = `
                <div style="padding: 40px;">
                    <img src="${product.image}" alt="${currentLang === 'ar' ? product.nameAr : product.nameEn}" style="width: 100%; max-height: 400px; object-fit: cover; border-radius: 15px; margin-bottom: 30px;">
                    <h2 class="gold-text" style="font-size: 32px; font-weight: 700; margin-bottom: 20px;">${currentLang === 'ar' ? product.nameAr : product.nameEn}</h2>
                    <p style="color: #ccc; font-size: 16px; line-height: 1.8; margin-bottom: 25px;">${currentLang === 'ar' ? product.descAr : product.descEn}</p>
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
                        <span class="price-original" style="font-size: 18px;">${formatPrice(product.originalPrice)}</span>
                        <span class="price-discount" style="font-size: 32px;">${formatPrice(product.price)}</span>
                    </div>
                    <button class="luxury-btn" style="width: 100%; padding: 18px; font-size: 18px;" onclick="addToCart(${product.id}); closeModal();">${translations[currentLang].addToCart}</button>
                </div>
            `;
            
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }
        
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    nameAr: product.nameAr,
                    nameEn: product.nameEn,
                    price: product.price,
                    quantity: 1,
                    image: product.image
                });
            }
            
            updateCart();
            animateCartIcon();
            renderProducts();
        }
        
        function updateQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(item => item.id !== id);
                }
                updateCart();
                renderProducts();
            }
        }
        
        function animateCartIcon() {
            const cartIcon = document.querySelector('.cart-icon');
            cartIcon.classList.add('add-to-cart-animation');
            setTimeout(() => cartIcon.classList.remove('add-to-cart-animation'), 600);
        }
        
        function updateCart() {
            const cartCount = document.getElementById('cartCount');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalItems;
            
            renderCartItems();
        }
        
        function renderCartItems() {
            const cartItemsDiv = document.getElementById('cartItems');
            const cartTotalDiv = document.getElementById('cartTotal');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = `<p style="color: #888; text-align: center; padding: 50px 0;">${currentLang === 'ar' ? 'السلة فارغة' : 'Cart is empty'}</p>`;
                cartTotalDiv.innerHTML = '';
                document.getElementById('checkoutSection').innerHTML = '';
                return;
            }
            
            cartItemsDiv.innerHTML = cart.map(item => `
                <div style="background: #2a2a2a; border-radius: 15px; padding: 20px; margin-bottom: 15px; display: flex; gap: 15px; align-items: center;">
                    <img src="${item.image}" alt="${currentLang === 'ar' ? item.nameAr : item.nameEn}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 10px;">
                    <div style="flex: 1;">
                        <h4 class="gold-text" style="font-size: 16px; margin-bottom: 8px;">${currentLang === 'ar' ? item.nameAr : item.nameEn}</h4>
                        <p class="price-discount" style="font-size: 18px;">${formatPrice(item.price)}</p>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span style="color: #fff; font-weight: 700; min-width: 30px; text-align: center;">${item.quantity}</span>
                        <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            cartTotalDiv.innerHTML = `
                <div style="font-size: 18px; color: #fff;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>${translations[currentLang].total}:</span>
                        <span class="gold-text" style="font-weight: 700;">${formatPrice(subtotal)}</span>
                    </div>
                </div>
            `;
            
            renderCheckoutForm();
        }
        
        function renderCheckoutForm() {
            const checkoutSection = document.getElementById('checkoutSection');
            
            checkoutSection.innerHTML = `
                <div class="checkout-form">
                    <h3 class="gold-text" style="font-size: 24px; margin-bottom: 20px;">${translations[currentLang].completeOrder}</h3>
                    <input type="text" class="form-input" id="customerName" placeholder="${translations[currentLang].name}" required>
                    <select class="form-input" id="customerCity" onchange="updateShipping()">
                        <option value="">-- ${translations[currentLang].city} --</option>
                        <option value="0">${currentLang === 'ar' ? 'الرباط (0 درهم)' : 'Rabat (0 DH)'}</option>
                        <option value="0">${currentLang === 'ar' ? 'سلا (0 درهم)' : 'Salé (0 DH)'}</option>
                        <option value="25">${currentLang === 'ar' ? 'الدار البيضاء (25 درهم)' : 'Casablanca (25 DH)'}</option>
                        <option value="35">${currentLang === 'ar' ? 'مدن أخرى (35 درهم)' : 'Other Cities (35 DH)'}</option>
                    </select>
                    <input type="tel" class="form-input" id="customerPhone" placeholder="${translations[currentLang].phone}" required>
                    <div id="shippingCost" style="color: #d4af37; font-size: 16px; margin: 15px 0;"></div>
                    <div id="finalTotal" style="color: #fff; font-size: 20px; font-weight: 700; margin: 15px 0;"></div>
                    <button class="luxury-btn" style="width: 100%; padding: 18px; font-size: 18px; margin-top: 20px;" onclick="placeOrder()">${translations[currentLang].orderNow}</button>
                </div>
            `;
        }
        
        function updateShipping() {
            const citySelect = document.getElementById('customerCity');
            const shippingCost = parseInt(citySelect.value) || 0;
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = subtotal + shippingCost;
            
            document.getElementById('shippingCost').textContent = `${translations[currentLang].shipping}: ${formatPrice(shippingCost)}`;
            document.getElementById('finalTotal').textContent = `${translations[currentLang].finalTotal}: ${formatPrice(total)}`;
        }
        
        function placeOrder() {
            const name = document.getElementById('customerName').value;
            const city = document.getElementById('customerCity');
            const phone = document.getElementById('customerPhone').value;
            
            if (!name || !city.value || !phone) {
                alert(currentLang === 'ar' ? 'الرجاء ملء جميع الحقول' : 'Please fill all fields');
                return;
            }
            
            const cityText = city.options[city.selectedIndex].text;
            const shippingCost = parseInt(city.value);
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const total = subtotal + shippingCost;
            
            let message = `*طلب جديد من NOUVA SHOP*\n\n`;
            message += `*الإسم:* ${name}\n`;
            message += `*المدينة:* ${cityText}\n`;
            message += `*الهاتف:* ${phone}\n\n`;
            message += `*المنتجات:*\n`;
            
            cart.forEach(item => {
                message += `• ${currentLang === 'ar' ? item.nameAr : item.nameEn} x${item.quantity} - ${formatPrice(item.price * item.quantity)}\n`;
            });
            
            message += `\n*المجموع:* ${formatPrice(subtotal)}\n`;
            message += `*التوصيل:* ${formatPrice(shippingCost)}\n`;
            message += `*المجموع النهائي:* ${formatPrice(total)}`;
            
            const whatsappUrl = `https://wa.me/212623999334?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
        
        function toggleCart() {
            cartOpen = !cartOpen;
            const cartSidebar = document.getElementById('cartSidebar');
            if (cartOpen) {
                cartSidebar.classList.add('active');
            } else {
                cartSidebar.classList.remove('active');
            }
        }
        
        function clearCart() {
            if (confirm(currentLang === 'ar' ? 'هل تريد إلغاء الطلب؟' : 'Cancel order?')) {
                cart = [];
                updateCart();
                renderProducts();
            }
        }
        
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.setAttribute('lang', currentLang);
            document.documentElement.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            
            document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'English' : 'عربي';
            
            Object.keys(translations[currentLang]).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.textContent = translations[currentLang][key];
                }
            });
            
            renderProducts();
            renderCartItems();
        }
        
        function toggleCurrency() {
            currentCurrency = currentCurrency === 'MAD' ? 'EUR' : 'MAD';
            document.getElementById('currencyBtn').textContent = currentCurrency === 'MAD' ? '€ EUR' : 'درهم MAD';
            renderProducts();
            renderCartItems();
        }
        
        function scrollToProducts() {
            document.getElementById('productsSection').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Initialize
        renderProducts();
    </script>
</body>
</html>
