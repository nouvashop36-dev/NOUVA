<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOUVA SHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-image"></div>

    <header>
        <div class="top-bar">
            <div class="cart-container">
                <div id="cart-icon" class="cart-icon">
                    🛒
                    <span id="cart-count">0</span>
                </div>
            </div>
            <div class="controls">
                <button id="lang-switcher" class="control-btn">English</button>
                <button id="currency-switcher" class="control-btn">EUR (€)</button>
            </div>
        </div>
    </header>

    <main>
        <div class="profile-section">
            <div id="logo-container" class="logo-container">
                <img src="https://i.postimg.cc/1XG432Ld/logo_jpg.png" alt="NOUVA SHOP Logo" class="logo">
            </div>
            <h1 class="shop-name">NOUVA SHOP</h1>
            <button id="view-products-btn" class="main-action-btn" data-lang-key="viewProducts">عرض منتوجات NOUVA SHOP</button>
        </div>

        <section id="products-section" class="products-section hidden">
            <h2 data-lang-key="ourProducts">منتجاتنا</h2>
            <div id="product-grid" class="product-grid">
                <!-- Product cards will be inserted here by JavaScript -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <h4 data-lang-key="socialMedia">مواقع التواصل</h4>
                <a href="#" target="_blank">انستقرام</a>
                <a href="#" target="_blank">فيسبوك</a>
                <a href="#" target="_blank">Linktree</a>
            </div>
            <div class="footer-right">
                <h4 data-lang-key="aboutUsFooter">حول المتجر</h4>
                <a href="#" data-lang-key="whoWeAre">من نحن</a>
                <a href="#" data-lang-key="contactUs">اتصل بنا</a>
                <a href="#" data-lang-key="aboutNouva">نبذة عن Nouva shop</a>
            </div>
        </div>
    </footer>

    <!-- Shopping Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <button id="close-cart-btn" class="close-btn">&times;</button>
        <h3 data-lang-key="shoppingCart">سلة المشتريات</h3>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
            <div class="total-price" data-lang-key="total">المجموع: <span id="cart-total">0.00</span> <span class="currency-symbol">درهم</span></div>
            <button id="order-now-btn" class="order-btn" data-lang-key="orderNow">اطلب الآن</button>
            <button id="cancel-order-btn" class="cancel-btn" data-lang-key="emptyCart">إلغاء الطلب</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 data-lang-key="completeOrder">إتمام الطلب</h3>
            <form id="checkout-form">
                <input type="text" id="customer-name" placeholder="الإسم الكامل" required data-lang-key="fullNamePlaceholder">
                <select id="customer-city" required>
                    <option value="" disabled selected data-lang-key="cityPlaceholder">اختر المدينة</option>
                    <option value="Rabat" data-cost="0">الرباط (0 درهم)</option>
                    <option value="Sale" data-cost="0">سلا (0 درهم)</option>
                    <option value="Casablanca" data-cost="25">الدار البيضاء (25 درهم)</option>
                    <option value="Other" data-cost="35">مدن أخرى (35 درهم)</option>
                </select>
                <input type="tel" id="customer-phone" placeholder="رقم الهاتف" required data-lang-key="phonePlaceholder">
                <button type="submit" class="order-btn" data-lang-key="confirmOrder">تأكيد الطلب عبر واتساب</button>
            </form>
            <button id="close-checkout-modal" class="close-btn">&times;</button>
        </div>
    </div>
    
    <!-- Admin Login Modal -->
    <div id="admin-login-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 data-lang-key="adminLogin">ولوج المسؤول</h3>
            <input type="password" id="admin-password" placeholder="كلمة السر">
            <button id="admin-login-btn" data-lang-key="login">دخول</button>
            <button id="close-admin-login-modal" class="close-btn">&times;</button>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="modal-overlay hidden">
        <div id="product-modal-content" class="modal-content product-modal-content">
             <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
